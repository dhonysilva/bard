[tools]
erlang = "27"
elixir = "1.18-otp-27"
# Python + dbt to run the existing dbt project and compare results with Bard
python = "3.12"
# Manages dbt from pyproject.toml / uv.lock into .venv
uv = "latest"

[settings]
# Activate uv's .venv (created by `mise run dbt:setup`) when inside the repo
python.uv_venv_auto = true

[env]
# Points to the existing dbt project that Bard will read/parse (adjust the path)
BARD_DBT_PROJECT_DIR = "./dbt_project"
# Local variables/secrets go in mise.local.toml (add it to .gitignore)

[tasks.setup]
description = "Install Elixir dependencies"
run = "mix local.hex --force && mix local.rebar --force && mix deps.get"

[tasks.compile]
description = "Compile the project"
run = "mix compile"

[tasks.test]
description = "Run the tests"
run = "mix test"

[tasks.format]
description = "Format the code"
run = "mix format"

[tasks.lint]
description = "Check formatting and compile with warnings as errors"
run = ["mix format --check-formatted", "mix compile --warnings-as-errors"]

[tasks.iex]
description = "Open IEx with the project loaded"
run = "iex -S mix"

[tasks."dbt:setup"]
description = "Install dbt from uv.lock into .venv"
run = "uv sync"

[tasks."dbt:upgrade"]
description = "Upgrade dbt in uv.lock and reinstall"
run = "uv lock --upgrade && uv sync"

[tasks."dbt:parse"]
description = "Generate dbt's manifest.json, useful as a reference for Bard's parser"
dir = "{{env.BARD_DBT_PROJECT_DIR}}"
run = "dbt parse"

[tasks."db:up"]
description = "Start the test Postgres (docker compose) and wait until it's healthy"
run = "docker compose up -d --wait"

[tasks."db:down"]
description = "Stop and remove the test Postgres"
run = "docker compose down"

[tasks."test:pg"]
description = "Run the tests that need Postgres"
run = "mix test --only postgres"
