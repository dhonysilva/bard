# Postgres for the tests excluded by default (:postgres, :compile_parity,
# :run_parity). Matches the BARD_TEST_PG_* defaults, so no env vars are needed:
#
#     docker compose up -d --wait
#     mix test --only postgres
#
# The image always creates the `postgres` db (used by :postgres tests);
# POSTGRES_DB adds `bard` (used by test/fixtures/shop for :compile_parity).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bard
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
